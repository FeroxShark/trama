# Instalador de Windows de Trama. Se arma en Linux con wine (scripts/construir.sh).
appId: app.trama.windows
productName: Trama
executableName: Trama
copyright: MIT
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**/*
  - build/icon.png
asar: true
# El árbol que se copia a Ubuntu (motor/ + app/ de `trama-exportar`); lo deja scripts/preparar-payload.sh.
extraResources:
  - from: payload
    to: payload
    filter: ["**/*"]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Trama-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Trama
# Dueño y repo de GitHub Releases: salen del entorno (scripts/construir.sh pone los de relleno).
publish:
  provider: github
  owner: ${env.TRAMA_GH_OWNER}
  repo: ${env.TRAMA_GH_REPO}
