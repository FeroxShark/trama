name: CI

on:
  push:

jobs:
  sondeo-cadena:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trama
      - uses: actions/checkout@v4
        with:
          path: sondeo-src
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: dependencias de la app
        working-directory: trama/app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts
      - name: cadena de lanzar_worker
        run: node sondeo-src/sondeo/cadena.mjs trama
