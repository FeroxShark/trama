name: CI

on:
  push:

jobs:
  sondeo-opencode:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: opencode por npm
        run: npm i -g opencode-ai
      - name: detección de Trama (CTX-53)
        working-directory: app
        run: |
          where.exe opencode
          node --input-type=module -e "const a=await import('./electron/opencode.ts'); const b=await import('./electron/cli/pa/motores/chequeo.ts'); console.log('resolverOpencode=' + a.resolverOpencode()); console.log('opencodeBin=' + JSON.stringify(b.opencodeBin(process.env)));"
