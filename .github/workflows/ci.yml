name: CI

on:
  push:

jobs:
  sondeo-consola:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: claude code
        run: npm i -g @anthropic-ai/claude-code
        continue-on-error: true
      - name: sondeo de consolas
        run: node sondeo/consola.mjs
