name: CI

on:
  push:

jobs:
  sondeo-detector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: detector con una ventana de control
        shell: powershell
        run: |
          $j = Start-Job { Start-Sleep 12; Start-Process cmd -ArgumentList '/c','ping','-n','3','127.0.0.1' }
          powershell -ExecutionPolicy Bypass -File sondeo/detectar-ventanas.ps1 -Segundos 25 -Salida "$env:TEMP\v.txt"
          Get-Content "$env:TEMP\v.txt"
