name: Windows nativo (.exe) + Linux (AppImage)

# Arma los instaladores de Trama:
# 1. Windows nativo (.exe) en windows-latest con windows/electron-builder-nativo.yml.
# 2. Linux (AppImage) en ubuntu-latest con app/electron-builder.yml.
# En un tag v*, publicar-nativo sube a la release del tag los artefactos de Windows (.exe, .blockmap, nativo.yml)
# y de Linux (.AppImage, latest-linux.yml).

on:
  push:
    branches: [main, "pa/**", "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  exe-nativo:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: app - dependencias
        working-directory: app
        run: npm ci
      - name: app - build (interfaz + electron)
        working-directory: app
        run: npm run build
      - name: windows - dependencias
        working-directory: windows
        run: npm ci
      - name: windows - tests
        working-directory: windows
        run: npm test
      - name: node.exe fijado (caché)
        uses: actions/cache@v4
        with:
          path: windows/.cache
          key: node-exe-${{ hashFiles('windows/src/payload-nativo.js') }}
      - name: payload nativo (sin bash)
        working-directory: windows
        run: node scripts/preparar-payload-nativo.mjs
      - name: versión de la carcasa (de app/package.json)
        working-directory: windows
        run: node scripts/sincronizar-version.mjs
      - name: electron-builder (NSIS x64)
        working-directory: windows
        env:
          TRAMA_GH_OWNER: ${{ github.repository_owner }}
          TRAMA_GH_REPO: ${{ github.event.repository.name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder --config electron-builder-nativo.yml --win nsis --x64 --publish never
      - name: el .exe y lo que lleva adentro
        working-directory: windows
        run: node scripts/verificar-exe-nativo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: trama-nativo-windows
          path: |
            windows/dist-nativo/*.exe
            windows/dist-nativo/*.blockmap
            windows/dist-nativo/nativo.yml
          if-no-files-found: error

  appimage-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: app - dependencias
        working-directory: app
        run: npm ci
      - name: app - build (interfaz + electron)
        working-directory: app
        run: npm run build
      - name: windows - dependencias (provee electron-builder)
        working-directory: windows
        run: npm ci
      - name: electron-builder (AppImage x64)
        working-directory: app
        env:
          TRAMA_GH_OWNER: ${{ github.repository_owner }}
          TRAMA_GH_REPO: ${{ github.event.repository.name }}
        run: ../windows/node_modules/.bin/electron-builder --config electron-builder.yml --linux AppImage --x64 --publish never
      - name: el AppImage y latest-linux.yml
        working-directory: app
        run: node scripts/verificar-appimage.mjs
      - name: verificar arranque del AppImage
        working-directory: app
        run: |
          chmod +x dist-appimage/*.AppImage
          ./dist-appimage/*.AppImage --appimage-extract-and-run --version || ./dist-appimage/*.AppImage --version
          timeout 5 xvfb-run --auto-servernum ./dist-appimage/*.AppImage --appimage-extract-and-run --no-sandbox || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: trama-appimage-linux
          path: |
            app/dist-appimage/*.AppImage
            app/dist-appimage/latest-linux.yml
          if-no-files-found: error

  publicar-nativo:
    needs: [exe-nativo, appimage-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trama-nativo-windows
      - uses: actions/download-artifact@v4
        with:
          name: trama-appimage-linux
      - name: nativo.yml y latest-linux.yml son de la versión del tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -qx "version: ${TAG#v}" nativo.yml || { echo "nativo.yml no es de $TAG:"; grep "^version:" nativo.yml; exit 1; }
          grep -qx "version: ${TAG#v}" latest-linux.yml || { echo "latest-linux.yml no es de $TAG:"; grep "^version:" latest-linux.yml; exit 1; }
      - name: subir a la release del tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" nativo.yml Trama-Nativo-Setup-*.exe Trama-Nativo-Setup-*.exe.blockmap latest-linux.yml Trama-*.AppImage --clobber
